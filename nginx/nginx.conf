# ==============================================================================
# Rauhie Shop — Production NGINX Reverse Proxy & Load Balancer Configuration
# Domain: www.rauhieshop.com / rauhieshop.com
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging with upstream response times
    log_format production_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log production_json;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting (DDoS & Surge Protection for Huge Customer Traffic)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=checkout_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Microcaching zone for read-only catalog queries
    proxy_cache_path /var/cache/nginx/rauhie_cache levels=1:2 keys_zone=rauhie_cache:20m max_size=1g inactive=60m use_temp_path=off;

    # ==========================================================================
    # UPSTREAM LOAD BALANCING POOLS
    # ==========================================================================
    # Load balances across multiple Next.js / Serverless API application instances
    upstream rauhie_backend_cluster {
        least_conn; # Distribute requests to least busy worker
        server backend-app-1:4000 max_fails=3 fail_timeout=10s;
        server backend-app-2:4000 max_fails=3 fail_timeout=10s;
        server backend-app-3:4000 max_fails=3 fail_timeout=10s backup;
        keepalive 32;
    }

    # Load balances static SPA frontend instances
    upstream rauhie_frontend_cluster {
        least_conn;
        server frontend-app-1:3000 max_fails=3 fail_timeout=10s;
        server frontend-app-2:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ==========================================================================
    # HTTP -> HTTPS Redirect
    # ==========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name rauhieshop.com www.rauhieshop.com;

        # ACME challenge for Let's Encrypt SSL certificates
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # MAIN HTTPS SERVER (SSL Termination, HTTP/2, Caching & Proxy)
    # ==========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name rauhieshop.com www.rauhieshop.com;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/rauhieshop.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rauhieshop.com/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL Ciphers (TLS 1.2 & 1.3)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Enterprise Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Global Connection Limit
        limit_conn conn_limit 50;

        # ----------------------------------------------------------------------
        # Backend API Proxy with Microcaching and Rate Limiting
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=25 nodelay;

            proxy_pass http://rauhie_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Microcache read-only endpoints (Products, Categories)
            proxy_cache rauhie_cache;
            proxy_cache_valid 200 60s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_bypass $http_authorization $cookie_nocache;
            proxy_no_cache $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Stricter Rate Limiting for Checkout & Payment Processing
        location /api/orders {
            limit_req zone=checkout_limit burst=10 nodelay;

            proxy_pass http://rauhie_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # ----------------------------------------------------------------------
        # CDN & Static Assets Caching (Images, Chunks, CSS, JS)
        # ----------------------------------------------------------------------
        location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf)$ {
            proxy_pass http://rauhie_frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # Frontend Single Page App / Server-Rendered Pages
        # ----------------------------------------------------------------------
        location / {
            limit_req zone=general_limit burst=50 nodelay;

            proxy_pass http://rauhie_frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

